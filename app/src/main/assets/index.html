<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanal İzle</title>
<style>
 body{margin:0;background:#111;color:#fff;font-family:sans-serif;padding:28px 40px}
 h1{font-size:34px;margin:0 0 6px} h2{font-size:22px;color:#999;margin:26px 0 10px}
 .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
 a{display:block;padding:26px 10px;text-align:center;font-size:26px;color:#fff;text-decoration:none;background:#25252b;border-radius:12px;border:4px solid transparent}
 a:focus{background:#c0392b;border-color:#fff;outline:none;transform:scale(1.05)}
 p{color:#888;font-size:18px}
</style></head><body>
<h1>📺 Kanal İzle</h1>
<p>Yön tuşlarıyla seç, OK ile aç. Geri tuşu listeye döndürür.</p>
<div id="app"></div>
<script>
// Kanal eklemek/düzeltmek için bu listeyi değiştir.
const CH = {
 'Ulusal': [
  ['TRT 1','https://www.tabii.com/tr/watch/live/trt1'],
  ['ATV','https://www.atv.com.tr/canli-yayin'],
  ['Show TV','https://www.showtv.com.tr/canli-yayin'],
  ['Kanal D','https://www.kanald.com.tr/canli-yayin'],
  ['Star TV','https://www.startv.com.tr/canli-yayin'],
  ['TV8','https://www.tv8.com.tr/canli-yayin'],
  ['Kanal 7','https://www.kanal7.com/canli-izle']],
 'Haber': [
  ['TRT Haber','https://www.trthaber.com/canli-yayin-trt-haber.html'],
  ['Halk TV','https://halktv.com.tr/canli-yayin'],
  ['Sözcü TV','https://www.sozcu.com.tr/canli-yayin'],
  ['Habertürk','https://www.haberturk.com/canliyayin'],
  ['CNN Türk','https://www.cnnturk.com/canli-yayin'],
  ['NTV','https://www.ntv.com.tr/canli-yayin/ntv'],
  ['TV100','https://tv100.com/canli-yayin']],
 'Yerel': [
  // ['Kanal adı','https://canlı-yayın-adresi']
 ]
};
const app = document.getElementById('app');
for (const g in CH) {
  if (!CH[g].length) continue;
  app.insertAdjacentHTML('beforeend','<h2>'+g+'</h2><div class="grid">'+
    CH[g].map(c=>'<a href="'+c[1]+'">'+c[0]+'</a>').join('')+'</div>');
}
document.querySelector('a').focus();
</script></body></html>
